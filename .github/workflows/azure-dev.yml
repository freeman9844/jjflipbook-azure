# Run when commits are pushed to main
on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - main

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  contents: read
  id-token: write
  packages: write


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      BACKEND_IMAGE: ghcr.io/freeman9844/jjflipbook-azure-backend:${{ github.sha }}
      FRONTEND_IMAGE: ghcr.io/freeman9844/jjflipbook-azure-frontend:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Export smoke attestation path
        run: echo "SMOKE_ATTESTATION_FILE=$RUNNER_TEMP/jjflipbook-smoke-attestation.json" >> "$GITHUB_ENV"
      - name: Install azd
        uses: Azure/setup-azd@v2.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: ${{ env.BACKEND_IMAGE }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: ${{ env.FRONTEND_IMAGE }}
      - name: Verify images are public
        run: |
          docker logout ghcr.io
          docker manifest inspect "$BACKEND_IMAGE" >/dev/null
          docker manifest inspect "$FRONTEND_IMAGE" >/dev/null
      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh

      - name: Preview infrastructure changes
        run: azd provision --preview --no-prompt
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      - name: Provision optimized infrastructure
        run: azd provision --no-prompt
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      - name: Resolve frontend URL
        run: |
          mapfile -t frontend_fqdns < <(
            az containerapp list --resource-group "rg-$AZURE_ENV_NAME" --output json |
              jq -r '.[] | select(.tags["azd-service-name"] == "frontend") | .properties.configuration.ingress.fqdn // empty'
          )
          if (( ${#frontend_fqdns[@]} != 1 )); then
            echo "Expected one frontend Container App FQDN, found ${#frontend_fqdns[@]}." >&2
            exit 1
          fi
          echo "FRONTEND_URL=https://${frontend_fqdns[0]}" >> "$GITHUB_ENV"
      - name: Smoke test deployment
        run: |
          FRONTEND_URL="$FRONTEND_URL" \
          SMOKE_ATTESTATION_FILE="$SMOKE_ATTESTATION_FILE" \
          ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
          bash scripts/smoke_test_deployment.sh
      - name: Clean up legacy Azure resources
        run: |
          FRONTEND_URL="$FRONTEND_URL" \
          SMOKE_ATTESTATION_FILE="$SMOKE_ATTESTATION_FILE" \
          bash scripts/cleanup_legacy_azure_resources.sh
      - name: Clean up GHCR versions
        run: python3 scripts/cleanup_ghcr_versions.py
        env:
          AZURE_ENV_NAME: ${{ env.AZURE_ENV_NAME }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
